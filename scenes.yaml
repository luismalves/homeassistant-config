#####
# Living room
#####

- id: movie_time
  name: Movie time
  icon: mdi:theater
  entities:
    light.luz_cozinha_1: "off"
    light.luz_cozinha_2: "off"
    light.luz_entrada: "off"
    light.luz_mesa: "off"
    light.led_strip_living_room: "off"
    light.led_tv:
      state: "on"

- id: bright_room
  name: Bright room
  icon: mdi:white-balance-sunny
  entities:
    select.wled_sideboard_preset:
      state: "Cosy"
    select.wled_tv_preset:
      state: "Solid"
    light.wiz_big_bulb:
      state: "on"
      brightness: 179
    light.light_2:
      state: "on"
      brightness: 255
    light.luz_mesa:
      state: "on"
      brightness: 204

