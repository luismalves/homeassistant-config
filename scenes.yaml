#####
# Bedroom
#####

- id: reading
  name: Reading
  icon: mdi:gamepad-variant-outline
  entities:
    light.bedroom_2:
      state: "on"
      brightness: 255
    light.bedroom_1:
      state: "on"
      brightness: 255
    light.luz_suite: "off"

- id: s_fm
  name: S-FM
  icon: mdi:radio
  entities:
    light.bedroom_2:
      state: "off"
    light.bedroom_1:
      state: "off"
    light.led_strip_deck:
      state: "on"
      rgb_color: [0, 190, 255]
      brightness: 255

- id: sleeping_left
  name: Sleeping left
  icon: mdi:sleep
  entities:
    select.wled_bed_preset:
      state: "Low Light Right"
    light.bedroom_1:
      state: "off"
    light.bedroom_2:
      state: "on"
      brightness: 90

- id: sleeping_right
  name: Sleeping right
  icon: mdi:sleep
  entities:
    select.wled_bed_preset:
      state: "Low Light Left"
    light.bedroom_1:
      state: "on"
      brightness: 90
    light.bedroom_2:
      state: "off"
