---
# Shower scripts
#

set_suite_shower_conditions:
  alias: "Prepares Suite for a shower"
  description: "Sets cover position to privacy only if cover is open and privacy mode is off"
  sequence:
    # Handle room cover with choose block
    - choose:
        - conditions:
            - condition: state
              entity_id: cover.estores_suite
              state: "open"
            - condition: state
              entity_id: binary_sensor.estores_suite_privacy_mode
              state: "off"
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.estores_suite
              data:
                position: 60
    # Handle WC cover with choose block
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: cover.estores_wc_suite
                  state: "closed"
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.estores_wc_suite
              data:
                position: 20
    # Turn on extractor fan if not already on after a delay
    - delay:
        seconds: 20
    - condition: state
      entity_id: light.extrator_wc_suite
      state: "off"
    - action: light.turn_on
      target:
        entity_id: light.extrator_wc_suite
  mode: single
