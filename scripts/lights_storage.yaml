---
# Lights group control - Storage
#

turn_off_storage:
  alias: Turn off lights of Storage
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.shelly_1pm_mini_storage
              state: "on"
          sequence:
            - action: switch.turn_off
              entity_id: switch.shelly_1pm_mini_storage

    - choose:
        - conditions:
            - condition: state
              entity_id: light.wled_storage_segment_1
              state: "on"
          sequence:
            - action: light.turn_off
              entity_id: light.wled_storage_segment_1

    - choose:
        - conditions:
            - condition: state
              entity_id: light.wled_storage_segment_2
              state: "on"
          sequence:
            - action: light.turn_off
              entity_id: light.wled_storage_segment_2

    - choose:
        - conditions:
            - condition: state
              entity_id: light.wled_storage_segment_3
              state: "on"
          sequence:
            - action: light.turn_off
              entity_id: light.wled_storage_segment_3
  mode: single
