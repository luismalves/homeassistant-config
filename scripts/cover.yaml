# Night breeze positions
# NOTE: the breeze-mode upper bound in binary_sensor.estores_*_breeze_mode
# (components/templates/cover.yaml) must stay >= the highest position used
# below (29 for sala, 30 for suite/bedroom_right/bedroom_left).
# All covers target a lower position when already closed vs. a higher one
# when they aren't (14/30 for suite+bedrooms, 13/29 for sala), to compensate
# for position-tracking drift that differs depending on whether the motor is
# moving up from closed or down from open.
set_cover_suite_breeze:
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: cover.estores_suite
              state: "closed"
          sequence:
            - action: cover.set_cover_position
              entity_id: cover.estores_suite
              data:
                position: 14
      default:
        - action: cover.set_cover_position
          entity_id: cover.estores_suite
          data:
            position: 30
  mode: single
  alias: Open suite cover to breeze position
  icon: mdi:window-shutter

