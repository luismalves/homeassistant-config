  mode: single
  alias: Toggle Estores WC Suite
  icon: mdi:window-shutter

close_all_rooms_covers:
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: cover.estores_quarto_esquerda
              state: "open"
          sequence:
            - action: cover.close_cover
              entity_id: cover.estores_quarto_esquerda
    - choose:
        - conditions:
            - condition: state
              entity_id: cover.estores_quarto_direita
              state: "open"
          sequence:
            - action: cover.close_cover
              entity_id: cover.estores_quarto_direita
    - choose:
        - conditions:
            - condition: state
              entity_id: cover.estores_suite
              state: "open"
          sequence:
            - action: cover.close_cover
              entity_id: cover.estores_suite
  mode: single
  alias: Close all rooms covers
  icon: mdi:window-shutter

# Morning positions
open_bedroom_cover_morning:
  sequence:
    - action: cover.set_cover_position
      entity_id: cover.estores_suite
      data:
        position: 35
  mode: single
  alias: Open bedroom cover to morning position
  icon: mdi:window-shutter

# Privacy positions
# NOTE: the "position > X and <= Y" checks below must stay in sync with
# binary_sensor.estores_*_privacy_mode in components/templates/cover.yaml,
# and the lower bound must match the breeze upper bound further down
# (29 for sala, 30 for suite/bedroom_right/bedroom_left).
# Suite, bedroom_right, and bedroom_left target a lower position (60, same
# drift compensation as the breeze scripts above) when the cover is already
# closed vs. a higher one (76) when it isn't.
set_cover_suite_privacy:
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {% set position = state_attr('cover.estores_suite', 'current_position') | int(0) %}
                {{ position > 30 and position <= 76 }}
            - condition: sun
              after: sunset
              before: sunrise
          sequence:
            - action: cover.close_cover
              entity_id: cover.estores_suite
        - conditions:
            - condition: template
              value_template: >
                {% set position = state_attr('cover.estores_suite', 'current_position') | int(0) %}
                {{ position > 30 and position <= 76 }}
            - condition: sun
              after: sunrise
              before: sunset
          sequence:
            - action: cover.open_cover
              entity_id: cover.estores_suite
      default:
        - choose:
            - conditions:
                - condition: state
                  entity_id: cover.estores_suite
                  state: "closed"
              sequence:
                - action: cover.set_cover_position
                  entity_id: cover.estores_suite
                  data:
                    position: 60
          default:
            - action: cover.set_cover_position
              entity_id: cover.estores_suite
              data:
                position: 76
  mode: single
  alias: Open suite cover to privacy position
  icon: mdi:window-shutter

