#####
# Dashboard UI visibility sensors
#
#####

- sensor:
    - name: Show Weather Forecast
      unique_id: show_weather_forecast
      state: >-
        {% set hour = now().hour %}
        {{ (hour >= 6 and hour < 10) or (hour >= 19 and hour < 22) }}

    - name: Show Covers Close Buttons
      unique_id: show_covers_close
      state: >-
        {% set hour = now().hour %}
        {% set time_ok = hour >= 18 or hour < 5 %}
        {% set sala_low = is_state('cover.estores_sala', 'closed') or is_state('binary_sensor.estores_sala_breeze_mode', 'on') %}
        {% set suite_low = is_state('cover.estores_suite', 'closed') or is_state('binary_sensor.estores_suite_breeze_mode', 'on') %}
        {% set left_low = is_state('cover.estores_quarto_esquerda', 'closed') or is_state('binary_sensor.estores_bedroom_left_breeze_mode', 'on') %}
        {% set right_low = is_state('cover.estores_quarto_direita', 'closed') or is_state('binary_sensor.estores_bedroom_right_breeze_mode', 'on') %}
        {% set wc_low = is_state('cover.estores_wc_suite', 'closed') %}
        {% set all_low = sala_low and suite_low and left_low and right_low and wc_low %}
        {{ time_ok and not all_low }}
