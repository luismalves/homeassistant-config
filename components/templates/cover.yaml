#####
# Cover sensors
#
#####

# Privacy sensors
# NOTE: thresholds must mirror the "already in privacy position" template
# condition inside the matching script in scripts/cover.yaml (set_cover_*_privacy),
# and must not overlap the breeze sensors below (breeze ends at 23, privacy
# starts above 23) or both modes can report "on" at once.
- binary_sensor:
    - unique_id: "estores_suite_privacy_mode"
      name: "Estores Suite privacy mode"
      state: >
        {% set position = state_attr('cover.estores_suite', 'current_position') | int(0) %}
        {{ position > 23 and position <= 65 }}

- binary_sensor:
    - unique_id: "estores_sala_privacy_mode"
      name: "Estores Sala privacy mode"
      state: >
        {% set position = state_attr('cover.estores_sala', 'current_position') | int(0) %}
        {{ position > 23 and position <= 55 }}

# Breeze sensors
# NOTE: upper bound must match the "position" set by the matching
# set_cover_*_breeze script in scripts/cover.yaml (currently 23 for all covers).
- binary_sensor:
    - unique_id: "estores_sala_breeze_mode"
      name: "Estores Sala breeze mode"
      state: >
        {% set position = state_attr('cover.estores_sala', 'current_position') | int(0) %}
        {{ position > 1 and position <= 23 }}

- binary_sensor:
    - unique_id: "estores_suite_breeze_mode"
      name: "Estores Suite breeze mode"
      state: >
        {% set position = state_attr('cover.estores_suite', 'current_position') | int(0) %}
        {{ position > 1 and position <= 23 }}

- binary_sensor:
    - unique_id: "estores_bedroom_left_breeze_mode"
      name: "Estores Bedroom Left breeze mode"
      state: >
        {% set position = state_attr('cover.estores_quarto_esquerda', 'current_position') | int(0) %}
        {{ position > 1 and position <= 23 }}

- binary_sensor:
    - unique_id: "estores_bedroom_right_breeze_mode"
      name: "Estores Bedroom Right breeze mode"
      state: >
        {% set position = state_attr('cover.estores_quarto_direita', 'current_position') | int(0) %}
        {{ position > 1 and position <= 23 }}

- sensor:
    - name: Shutters status
      unique_id: shutters_status
      state: >-
        {% if is_state('input_boolean.open_blinds_temporarly', 'on') %}
          Temp. abertos
        {% elif state_attr("cover.shelly_roller_left","current_position") == 0 and state_attr("cover.shelly_roller_right","current_position") == 0 %}
          Fechados
        {% else %}
          Abertos
        {% endif %}

    - name: Estores abertos (quartos)
      unique_id: covers_open_rooms
      unit_of_measurement: "open"
      state: >
        {% set covers = [
          states.cover.estores_quarto_esquerda,
          states.cover.estores_quarto_direita,
          states.cover.estores_suite,
          states.cover.estores_wc_suite
          ] %}
        {{ covers | rejectattr('state','eq','closed') | list | count }}

    - name: Estores abertos (todos)
      unique_id: covers_open_all
      unit_of_measurement: "open"
      state: >
        {% set covers = [
          states.cover.estores_sala,
          states.cover.estores_quarto_esquerda,
          states.cover.estores_quarto_direita,
          states.cover.estores_suite,
          states.cover.estores_wc_suite
          ] %}
        {{ covers | rejectattr('state','eq','closed') | list | count }}
