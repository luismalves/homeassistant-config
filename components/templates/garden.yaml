#####

# Irrigation
- sensor:
    - unique_id: "days_since_irrigation"
      name: "Dias desde a última rega"
      state: >
        {% if states('switch.water_valve') not in ['unknown', 'unavailable'] %}
          {% set last_datetime = states.switch.water_valve.last_changed | as_local %}
          {% set hours_diff = (now() - last_datetime).total_seconds() / 3600 %}
          {{ (hours_diff / 24) | round(0, 'floor') | int }}
        {% else %}
          unavailable
        {% endif %}
      unit_of_measurement: "d"
      icon: mdi:sprinkler
      device_class: duration
