#####
# Pet related
#
#####

# Litter
- sensor:
    - unique_id: "days_since_cat_litter_change"
      name: "Dias desde a última revisão da areia"
      availability: "{{ states('input_datetime.last_cat_litter_change') not in ['unknown', 'unavailable'] }}"
      state: >
        {% set last_change = states('input_datetime.last_cat_litter_change') %}
        {% set last_datetime = last_change | as_datetime | as_local %}
        {% set hours_diff = (now() - last_datetime).total_seconds() / 3600 %}
        {{ (hours_diff / 24) | round(0, 'floor') | int }}
      unit_of_measurement: "d"
      icon: mdi:delete-variant

- sensor:
    - unique_id: "days_since_cat_litter_full_change"
      name: "Dias desde a última troca total da areia"
      availability: "{{ states('input_datetime.last_full_cat_litter_change') not in ['unknown', 'unavailable'] }}"
      state: >
        {% set last_change = states('input_datetime.last_full_cat_litter_change') %}
        {% set last_datetime = last_change | as_datetime | as_local %}
        {% set hours_diff = (now() - last_datetime).total_seconds() / 3600 %}
        {{ (hours_diff / 24) | round(0, 'floor') | int }}
      unit_of_measurement: "d"
      icon: mdi:delete-variant

# Alerts
- sensor:
    - unique_id: "pet_alerts"
      name: "Alertas do gato"
      state: >
        {% set litter_alert = states('sensor.days_since_cat_litter_change') | int(0) >= 3 %}
        {% set water_alert = states('sensor.petlibro_plwf105_water_level') | float(100) < 15 %}
        {{ [litter_alert, water_alert] | select('equalto', true) | list | count }}
      icon: mdi:alert-circle

# Fountain
- sensor:
    - unique_id: "petlibro_fountain_tank_status"
      name: "Pet foutain Tank Status"
      state: >
        {% if is_state('binary_sensor.petlibro_plwf105_tank_removed', 'off') %}
          Conectado
        {% else %}
          Removido
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.petlibro_plwf105_tank_removed', 'off') %}
          mdi:water-check
        {% else %}
          mdi:water-alert
        {% endif %}

- sensor:
    - unique_id: "days_since_last_tank_disconnection"
      name: "Days since last tank disconnection"
      availability: "{{ states('binary_sensor.petlibro_plwf105_tank_removed') not in ['unavailable', 'unknown'] }}"
      state: >
        {% set last_changed = states.binary_sensor.petlibro_plwf105_tank_removed.last_changed %}
        {% set days_diff = (now() - last_changed).days %}
        {{ days_diff }}
      unit_of_measurement: "d"
      icon: "mdi:calendar-clock"

# Feeder
- sensor:
    - unique_id: "pet_feeder_status"
      name: "Pet feeder status"
      state: >
        {% if is_state('binary_sensor.aqara_pet_feeder_error', 'off') %}
          OK
        {% else %}
          Erro
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.aqara_pet_feeder_error', 'off') %}
          mdi:food-drumstick
        {% else %}
          mdi:food-drumstick-off
        {% endif %}

- binary_sensor:
    - name: "Pet Feeder Is Paused"
      state: >
        {% set pause_time = states('input_datetime.pet_feeder_paused_until') %}
        {{ pause_time not in ['unknown', 'unavailable'] and 
            as_timestamp(pause_time) > as_timestamp(now()) }}
      icon: mdi:pause-circle
