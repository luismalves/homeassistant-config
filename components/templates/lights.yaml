            option: "{{ effect }}"

    # WLED Sideboard: same pattern, but only 1 segment total (no
    # segment_1/2), so the color fallback is really just "the segment,
    # or itself if unavailable" - kept in the same list form for
    # consistency with the other lights.
    - name: "Led Sideboard"
      unique_id: led_sideboard
      state: "{{ is_state('light.wled_sideboard_main', 'on') }}"
      level: "{{ state_attr('light.wled_sideboard_main', 'brightness') }}"
      rgbw: >-
        {% set segs = ['light.wled_sideboard'] %}
        {% set color_entity = segs | select('has_value') | list | first | default('light.wled_sideboard', true) %}
        {{ state_attr(color_entity, 'rgbw_color') }}
      effect_list: "{{ state_attr('select.wled_sideboard_preset', 'options') | default([], true) }}"
      effect: >-
        {% set preset = states('select.wled_sideboard_preset') %}
        {{ preset if preset not in ['unknown', 'unavailable'] else None }}
      availability: "{{ has_value('light.wled_sideboard_main') }}"
      supports_transition: true
      turn_on:
