#####
# Lights on counters
#
#####

- sensor:
    - name: Luzes ligadas na Sala
      unique_id: lights_on_living_room
      unit_of_measurement: "on"
      state: >
        {% set lights = [
          states.light.led_tv,
          states.light.light_2,
          states.light.wiz_big_bulb,
          states.light.led_sideboard,
          states.light.wled_xmas
          ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}

    - name: Luzes ligadas na Cozinha
      unique_id: lights_on_kitchen
      unit_of_measurement: "on"
      state: >
        {% set lights = [
          states.light.luz_entrada,
          states.light.luz_cozinha_1,
          states.light.luz_cozinha_2,
          states.light.luz_mesa,
          states.light.led_entrance
          ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}

    - name: Luzes ligadas no Quarto (Suite)
      unique_id: lights_on_bedroom_suite
      unit_of_measurement: "on"
      state: >
        {% set lights = [
          states.light.bedroom_1,
          states.light.bedroom_2,
          states.light.luz_suite,
          states.light.wled_roupeiro_suite_segment_1,
          states.light.wled_roupeiro_suite_segment_2,
          states.light.led_bed
          ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}

    - name: Luzes ligadas no WC (Suite)
      unique_id: lights_on_wc_suite
      unit_of_measurement: "on"
      state: >
        {% set lights = [
          states.light.led_wc_suite,
          states.light.extrator_wc_suite
          ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}

    - name: Luzes ligadas no Quarto (Direita)
      unique_id: lights_on_bedroom_right
      unit_of_measurement: "on"
      state: >
        {% set lights = [
          states.light.wled_standingdesk,
          states.light.mi_lamp_pro,
          states.light.luz_quarto_direita
          ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}

    - name: Luzes ligadas no Quarto (Esquerda)
      unique_id: lights_on_bedroom_left
      unit_of_measurement: "on"
      state: >
        {% set lights = [
          states.light.luz_quarto_esquerda,
          states.light.mi_lamp,
          states.light.led_strip_deck,
          states.light.led_strip_living_room,
          ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}

    - name: Luzes ligadas na Arrecadação
      unique_id: lights_on_storage
      unit_of_measurement: "on"
      state: >
        {% set lights = [
          states.switch.shelly_1pm_mini_storage,
          states.light.wled_storage_segment_1,
          states.light.wled_storage_segment_2,
          states.light.wled_storage_segment_3
          ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}

    - name: Luzes ligadas na Cozinha e Sala
      unique_id: lights_on_kitchen_living_room
      unit_of_measurement: "on"
      state: >
        {{ states('sensor.lights_on_kitchen')|int(0) + states('sensor.lights_on_living_room')|int(0) }}

    - name: Luzes ligadas na casa
      unique_id: lights_on_house
      unit_of_measurement: "on"
      state: >
        {{ states('sensor.lights_on_bedroom_left')|int(0) + states('sensor.lights_on_kitchen')|int(0) + states('sensor.lights_on_living_room')|int(0) + states('sensor.lights_on_bedroom_suite')|int(0) + states('sensor.lights_on_bedroom_right')|int(0) }}
