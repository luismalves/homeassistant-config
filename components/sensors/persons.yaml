#####
# Time at home, per person
# Reset daily. The daily total survives the recorder purge as the
# long-term statistics "max" for each day, so monthly totals stay
# available.
#####

- platform: history_stats
  name: "Luis home today"
  unique_id: luis_home_today
  entity_id: person.luis_alves
  state: "home"
  type: time
  start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
  end: "{{ now() }}"

- platform: history_stats
  name: "Margarida home today"
  unique_id: margarida_home_today
  entity_id: person.margarida
  state: "home"
  type: time
  start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
  end: "{{ now() }}"
