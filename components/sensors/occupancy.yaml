#####
# Room occupancy runtime
# Time each room's presence sensor spent "on", reset daily.
# Sources mirror components/templates/motion.yaml.
# The daily total survives the recorder purge as the long-term
# statistics "max" for each day, so monthly totals stay available.
#####

# NOTE: source device (Everything Presence Lite 2) is currently
# unavailable — this records 0 until it is back online.
- platform: history_stats
  name: "Living room occupied today"
  unique_id: living_room_occupied_today
  entity_id: binary_sensor.everything_presence_lite_5d1fc0_occupancy
  state: "on"
  type: time
  start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
  end: "{{ now() }}"

