sensors: >
  [[[
    const sensor1 = `<div class="pill"><ha-icon
      icon="mdi:thermometer-low"
      style="width: 10px;">
      </ha-icon><span><span>${Number(states['sensor.gw2000a_outdoor_temperature'].state).toFixed(1)}º</span></span></div>`

    const sensor2 = `<div class="pill"><ha-icon
      icon="mdi:water-percent"
      style="width: 10px;">
      </ha-icon><span>${states['sensor.gw2000a_humidity'].state}%</span></div>`

    const sensor3 = `<div class="pill"><ha-icon
      icon="mdi:weather-dust"
      style="width: 10px;">
      </ha-icon><span>${states['sensor.gw2000a_wind_speed'].state} km/h</span></div>`

    return sensor1 + sensor2 + sensor3;
  ]]]
