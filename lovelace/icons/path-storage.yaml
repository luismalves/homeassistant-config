sd1: >
  [[[
    return `<div class="pill"><ha-icon
      icon="mdi:thermometer-low"
      style="width: 10px;">
      </ha-icon><span>${states['sensor.environment_4_temperature'].state}º</span></div>`
  ]]]

sd2: >
  [[[
    return `<div class="pill"><ha-icon
      icon="mdi:water-percent"
      style="width: 10px;">
      </ha-icon><span>${states['sensor.environment_4_humidity'].state}%</span></div>`
  ]]]

sd3: >
  [[[
    let numlight = states['sensor.lights_on_storage'].state;
    if (numlight == 1) return `<div class="pill"><span> ${states['sensor.lights_on_storage'].state} luz</span></div>`;
    else if (numlight > 1) return `<div class="pill"><span> ${states['sensor.lights_on_storage'].state} luzes</span></div>`;
    return ``
  ]]]
