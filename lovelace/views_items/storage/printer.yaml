type: picture-elements
view_layout:
  grid-column: span 6
elements:
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.p2s_print_status
        state_not: offline
    elements:
      - entity: light.p2s_chamber_light
        type: state-icon
        style:
          top: 46%
          left: 18%
          "--mdc-icon-size": 2.6em
        tap_action:
          action: toggle
      - entity: sensor.p2s_print_status
        type: state-label
        style:
          top: 6.5%
          left: 26.5%
          font-size: 0.9em
          font-weight: 500
          color: "#FFFFFF"
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.p2s_print_status
            state:
              - running
              - pause
        elements:
          - type: conditional
            conditions:
              - condition: state
                entity: image.p2s_cover_image
                state_not: unavailable
            elements:
              - type: image
                entity: image.p2s_cover_image
                tap_action:
                  action: none
                style:
                  top: 50%
                  left: 50%
                  width: 55%
                  height: 55%
                  transform: translate(-50%, -50%)
          - entity: sensor.p2s_remaining_time
            type: state-label
            tap_action:
              action: none
            style:
              top: 13%
              left: 22%
              font-size: 0.85em
              font-weight: 500
              color: "#FFFFFF"
          - entity: sensor.p2s_print_progress
            type: state-label
            tap_action:
              action: none
            style:
              top: 12.5%
              left: 81%
              font-size: 1em
              font-weight: 600
              color: "#FFFFFF"
      - entity: sensor.p2s_nozzle_temperature
        type: state-label
        style:
          top: 31%
          left: 51%
          font-size: 0.85em
          font-weight: 500
          color: "#FFFFFF"
      - entity: sensor.p2s_bed_temperature
        type: state-label
        style:
          top: 78%
          left: 51%
          font-size: 0.85em
          font-weight: 500
          color: "#FFFFFF"
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.p2s_chamber_temperature
            state_not:
              - "unavailable"
              - "unknown"
        elements:
          - entity: sensor.p2s_chamber_temperature
            type: state-label
            style:
              font-size: 0.85em
              font-weight: 500
              top: 31%
              left: 19%
              color: "#FFFFFF"
card_mod:
  style: |
    ha-card {
      box-shadow: none !important;
      background: none !important;
      border: none !important;
    }
image: /local/images/printer/on_p2s.png
entity: light.p2s_chamber_light
state_image:
  unavailable: /local/images/printer/off_p2s.png
  "on": /local/images/printer/on_p2s.png
  "off": /local/images/printer/off_p2s.png
