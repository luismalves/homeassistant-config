type: picture-elements
view_layout:
  grid-column: span 6
elements:
  - type: conditional
    conditions:
      - condition: state
        state_not: unavailable
        entity: binary_sensor.p2s_ams_active
      - condition: state
        state_not: unknown
        entity: binary_sensor.p2s_ams_active
      - condition: state
        entity: binary_sensor.p2s_ams_drying
        state: "off"
    elements:
      - type: state-label
        entity: binary_sensor.p2s_ams_active
        tap_action:
          action: none
        style:
          top: 60%
          left: 50%
          text-align: center
          font-size: 0.8em
          background-color: rgba(0,0,0,0)
          box-shadow: 0 0 3px 3px rgba(0, 0, 0, 0)
          border-radius: 10px
          pointer-events: none
          color: "#FFFFFF"

  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.p2s_ams_drying
        state: "on"
    elements:
      - type: custom:button-card
        entity: sensor.p2s_ams_remaining_drying_time
        show_icon: false
        show_name: false
        show_state: false
        show_label: true
        label: >
          [[[
            return 'Drying · ' + helpers.localize(entity);
          ]]]
        tap_action:
          action: none
        style:
          top: 60%
          left: 50%
        styles:
          card:
            - background-color: transparent
            - padding: 2px
            - border: none
            - box-shadow: none
            - width: fit-content
          label:
            - color: "#FFFFFF"
            - font-size: 0.75em
            - font-weight: 400

  # Tray 1
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.p2s_ams_tray_1
        state_not:
          - empty
          - Empty
          - unavailable
          - unknown
    elements:
      - type: state-icon
        entity: sensor.p2s_ams_tray_1
        icon: mdi:circle
        style:
          top: 28%
          left: 21.4%
          "--state-icon-color": var(--tray_1_color)
          background-color: rgba(0,0,0,0.5)
          box-shadow: 0 0 5px 5px var(--tray_1_bg)
          border-radius: 50px
          "--mdc-icon-size": 2.4em
      - type: custom:button-card
        entity: sensor.p2s_ams_tray_1
        show_icon: false
        show_name: false
        show_state: false
        show_label: true
        label: >
          [[[
            const remain = entity.attributes.remain;
            const weight = parseInt(entity.attributes.tray_weight) || 1000;
            return Math.round((remain - 0.5) * weight / 100) + 'g';
          ]]]
        tap_action:
          action: none
        style:
          top: 17%
          left: 21.4%
        styles:
          card:
            - background-color: rgba(0,0,0,0.85)
            - border-radius: 50px
            - padding: 2px 6px
            - min-width: 35px
            - border: none
            - box-shadow: none
          label:
            - color: "#FFFFFF"
            - font-size: 0.65em
            - font-weight: 400
            - line-height: 0.9
            - overflow: visible
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.p2s_ams_tray_1
        state:
          - empty
          - Empty
    elements:
      - type: state-icon
        entity: sensor.p2s_ams_tray_1
        icon: mdi:tray
        style:
          top: 28%
          left: 21.4%
          "--state-icon-color": var(--tray_1_color)
          background-color: rgba(0,0,0,0.5)
          box-shadow: 0 0 5px 5px var(--tray_1_bg)
          border-radius: 50px
          "--mdc-icon-size": 2.4em
  - type: state-label
    entity: sensor.p2s_ams_tray_1
    attribute: type
    tap_action:
      action: none
    style:
      top: 77%
      left: 21%
      text-align: center
      font-size: 1em
      background-color: rgba(0,0,0,0.4)
      box-shadow: 0 0 5px 5px rgba(0, 0, 0, 0.4)
      border-radius: 50px
      pointer-events: none
      font-weight: 700
      color: "#FFFFFF"

