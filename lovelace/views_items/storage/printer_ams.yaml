image: /local/images/printer/AMS_2.png
card_mod:
  style: |
    ha-card {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      --tray_1_color: {% if is_state_attr('sensor.p2s_ams_tray_1', 'color', '#00000000') %} rgb(255, 255, 255); {% else %} {{state_attr('sensor.p2s_ams_tray_1', 'color') }}; {% endif %}
      --tray_2_color: {% if is_state_attr('sensor.p2s_ams_tray_2', 'color', '#00000000') %} rgb(255, 255, 255); {% else %} {{state_attr('sensor.p2s_ams_tray_2', 'color') }}; {% endif %}
      --tray_3_color: {% if is_state_attr('sensor.p2s_ams_tray_3', 'color', '#00000000') %} rgb(255, 255, 255); {% else %} {{state_attr('sensor.p2s_ams_tray_3', 'color') }}; {% endif %}
      --tray_4_color: {% if is_state_attr('sensor.p2s_ams_tray_4', 'color', '#00000000') %} rgb(255, 255, 255); {% else %} {{state_attr('sensor.p2s_ams_tray_4', 'color') }}; {% endif %}
      --tray_1_bg: {% if is_state_attr('sensor.p2s_ams_tray_1', 'active', true) %} rgba(255, 255, 126, 0.5); {% else %} rgba(0,0,0,0.5); {% endif %}
      --tray_2_bg: {% if is_state_attr('sensor.p2s_ams_tray_2', 'active', true) %} rgba(255, 255, 126, 0.5); {% else %} rgba(0,0,0,0.5); {% endif %}
      --tray_3_bg: {% if is_state_attr('sensor.p2s_ams_tray_3', 'active', true) %} rgba(255, 255, 126, 0.5); {% else %} rgba(0,0,0,0.5); {% endif %}
      --tray_4_bg: {% if is_state_attr('sensor.p2s_ams_tray_4', 'active', true) %} rgba(255, 255, 126, 0.5); {% else %} rgba(0,0,0,0.5); {% endif %}
      }
