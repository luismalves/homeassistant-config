icon1: >
  [[[
    const temp = parseFloat(entity.state);
    let color = 'var(--el-es-static-text-color)';
    if (!isNaN(temp)) {
      if (temp < 16) color = '#4FC3F7';
      else if (temp < 20) color = '#29B6F6';
      else if (temp < 24) color = '#FFA726';
      else color = '#EF5350';
    }
    return `<ha-icon icon="mdi:thermometer" style="--mdc-icon-size: 18px; color: ${color};"></ha-icon>`;
  ]]]

text1: >
  [[[
    const temp = parseFloat(entity.state);
    const val = isNaN(temp) ? '-' : temp.toFixed(1);
    const unit = entity.attributes.unit_of_measurement || '°C';
    const outsideEntity = variables.outside_entity ? states[variables.outside_entity] : null;
    let outsideHtml = '';
    if (outsideEntity) {
      const outTemp = parseFloat(outsideEntity.state);
      const outVal = isNaN(outTemp) ? '-' : outTemp + '°C';
      outsideHtml = `<span style="font-size:15px; font-weight:normal; color: var(--contrast12);">| ${outVal}</span>`;
    }
    return `<div style="display:flex; flex-direction:row; align-items:center; gap:6px;">
      <span style="font-size:16px;">${val}${unit}</span>
      ${outsideHtml}
    </div>`;
  ]]]
