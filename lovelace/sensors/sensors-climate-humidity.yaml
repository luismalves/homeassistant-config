icon1: >
  [[[
    const hum = parseFloat(entity.state);
    let color = 'var(--el-es-static-text-color)';
    if (!isNaN(hum)) {
      if (hum < 30) color = '#FFA726';
      else if (hum < 80) color = '#4FC3F7';
      else color = '#EF5350';
    }
    return `<ha-icon icon="mdi:water-percent" style="--mdc-icon-size: 18px; color: ${color};"></ha-icon>`;
  ]]]

text1: >
  [[[
    const hum = parseFloat(entity.state);
    const val = isNaN(hum) ? '-' : hum.toFixed(0);
    const unit = entity.attributes.unit_of_measurement || '%';
    const outsideEntity = variables.outside_entity ? states[variables.outside_entity] : null;
    let outsideHtml = '';
    if (outsideEntity) {
      const outHum = parseFloat(outsideEntity.state);
      const outVal = isNaN(outHum) ? '-' : Math.floor(outHum) + '%';
      outsideHtml = `<span style="font-size:15px; font-weight:normal; color: var(--contrast12);">| ${outVal}</span>`;
    }
    return `<div style="display:flex; flex-direction:row; align-items:center; gap:6px;">
      <span style="font-size:16px;">${val}${unit}</span>
      ${outsideHtml}
    </div>`;
  ]]]
