####
# VIEW
# Varanda
####
title: Varanda
path: balcony
background: "var(--background-view-bedroom)"

type: custom:vertical-layout
layout:
  card_margin: 8px 0px
  margin: 0px
  max_width: 350
cards:
  - type: "custom:gap-card"
    height: 5

  - type: "custom:layout-card"
    layout_type: "custom:grid-layout"
    layout:
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr
      grid-template-rows: auto
      margin: 0px
    cards:
      - template: title
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 6
        variables:
          - content: Varanda

      - type: "custom:gap-card"
        height: 15
        view_layout:
          grid-column: span 6

      - template: subtitle
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 6
        variables:
          - content: Rega gota-a-gota

      - template: btn-small-confirmation
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 3
        variables:
          - template: btn-irrigation
          - service: button.press
          - entity: button.start_irrigation_system
          - name: "Ligar rega"
          - name-active: "Desligar rega"
          - entity-state: switch.water_valve
          - state-active: "on"

      - template: es-config
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 3
        variables:
          - template: alert
          - entity: input_boolean.enable_drip_schedule_automation
          - name: "Automação sistema rega"
          - state-1: "on"
          - state-2: "off"
          - align-self-name: center
          - grid-template-rows: 1fr
          - card-height: 60px

      - type: "custom:layout-card"
        layout_type: "custom:grid-layout"
        view_layout:
          grid-column: span 6
        layout:
          grid-template-columns: repeat(7, 1fr)
          grid-template-rows: auto
          margin: 0px
          card_margin: 0px 4px
        cards:
          - template: btn-day
            type: "custom:decluttering-card"
            variables:
              - entity: input_boolean.irrigation_enabled_monday
              - name: "Seg"

          - template: btn-day
            type: "custom:decluttering-card"
            variables:
              - entity: input_boolean.irrigation_enabled_tuesday
              - name: "Ter"

          - template: btn-day
            type: "custom:decluttering-card"
            variables:
              - entity: input_boolean.irrigation_enabled_wednesday
              - name: "Qua"

          - template: btn-day
            type: "custom:decluttering-card"
            variables:
              - entity: input_boolean.irrigation_enabled_thursday
              - name: "Qui"

          - template: btn-day
            type: "custom:decluttering-card"
            variables:
              - entity: input_boolean.irrigation_enabled_friday
              - name: "Sex"

          - template: btn-day
            type: "custom:decluttering-card"
            variables:
              - entity: input_boolean.irrigation_enabled_saturday
              - name: "Sáb"

          - template: btn-day
            type: "custom:decluttering-card"
            variables:
              - entity: input_boolean.irrigation_enabled_sunday
              - name: "Dom"

      - template: es-config-number
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 3
        variables:
          - template: lxc
          - entity: input_number.duration_of_irrigation
          - name: "Configuração"
          - description: "Duração rega"

      - template: sensor-number
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 3
        variables:
          - template: sensors-empty
          - entity: sensor.days_since_irrigation
          - name: "desde última rega"
          - height: 92px
          - conditional_unit: true

      - type: "custom:gap-card"
        height: 30
        view_layout:
          grid-column: span 6

      - template: subtitle
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 6
        variables:
          - content: Weather station

      - type: "custom:mini-graph-card"
        view_layout:
          grid-column: span 3
        entities:
          - entity: sensor.gw2000a_outdoor_temperature
        name: Temperatura
        icon: mdi:thermometer
        show:
          name: true
          icon: true
          labels: true
          extrema: true
        tap_action:
          action: none
        hours_to_show: 12
        font_size: 65
        height: 150
        points_per_hour: 2
        color_thresholds: !include ../graphs/temp-thresholds.yaml
        card_mod:
          style: !include ../styles/style-graph-wtitle-weather.yaml

      - type: "custom:mini-graph-card"
        view_layout:
          grid-column: span 3
        entities:
          - entity: sensor.gw2000a_humidity
        name: Humidade
        icon: mdi:water-percent
        show:
          name: true
          icon: true
          labels: true
          extrema: true
        tap_action:
          action: none
        hours_to_show: 12
        font_size: 65
        height: 150
        points_per_hour: 2
        color_thresholds: !include ../graphs/humidity-thresholds.yaml
        card_mod:
          style: !include ../styles/style-graph-wtitle-weather.yaml

      - type: "custom:mini-graph-card"
        view_layout:
          grid-column: span 3
        entities:
          - entity: sensor.gw2000a_wind_speed
        name: Vento
        icon: mdi:weather-windy
        show:
          name: true
          icon: true
          labels: true
          extrema: true
        tap_action:
          action: none
        hours_to_show: 12
        font_size: 65
        height: 150
        points_per_hour: 2
        card_mod:
          style: !include ../styles/style-graph-wtitle-weather.yaml

      - type: "custom:mini-graph-card"
        view_layout:
          grid-column: span 3
        entities:
          - entity: sensor.gw2000a_hourly_rain_piezo
        name: Precipitação
        icon: mdi:weather-rainy
        show:
          name: true
          icon: true
          labels: true
          extrema: true
        tap_action:
          action: none
        hours_to_show: 12
        font_size: 65
        height: 150
        points_per_hour: 2
        card_mod:
          style: !include ../styles/style-graph-wtitle-weather.yaml

      - type: "custom:gap-card"
        height: 30
        view_layout:
          grid-column: span 6

      - template: subtitle
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 3
        variables:
          - content: Planta (Metros.)

      - template: subtitle
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 3
        variables:
          - content: Planta (Jasmim)

      - type: custom:mod-card
        view_layout:
          grid-column: span 3
        card_mod:
          style:
            layout-card $ grid-layout $: "#root { --masonry-view-card-margin: 3.3px 0; align-items: center;}"
        card:
          type: "custom:layout-card"
          view_layout:
            grid-column: span 1
          layout_type: "custom:grid-layout"
          layout:
            card_margin: 0px
            grid-template-columns: 1fr
            grid-template-rows: 1fr 1fr 1fr
            height: 100%
            margin: 0
            padding: 0
          cards:
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.plant_sensor_1_temperature
                - icon: mdi:thermometer
                - background-default: --ha-card-background-es-static
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.plant_sensor_1_moisture
                - icon: mdi:water-percent
                - background-default: --ha-card-background-es-static
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.plant_sensor_1_conductivity
                - icon: mdi:lightning-bolt
                - background-default: --ha-card-background-es-static

      - type: custom:mod-card
        view_layout:
          grid-column: span 3
        card_mod:
          style:
            layout-card $ grid-layout $: "#root { --masonry-view-card-margin: 3.3px 0; align-items: center;}"
        card:
          type: "custom:layout-card"
          view_layout:
            grid-column: span 1
          layout_type: "custom:grid-layout"
          layout:
            card_margin: 0px
            grid-template-columns: 1fr
            grid-template-rows: 1fr 1fr 1fr
            height: 100%
            margin: 0
            padding: 0
          cards:
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.plant_sensor_2_temperature
                - icon: mdi:thermometer
                - background-default: --ha-card-background-es-static
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.plant_sensor_2_moisture
                - icon: mdi:water-percent
                - background-default: --ha-card-background-es-static
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.plant_sensor_2_conductivity
                - icon: mdi:lightning-bolt
                - background-default: --ha-card-background-es-static
