####
# VIEW
# WCs - Geral (Maior + Social)
####
title: WCs
path: wc-geral
background: "var(--background-view-bedroom)"

type: custom:vertical-layout
layout:
  card_margin: 8px 0px
  margin: 0px
  max_width: 350
cards:
  - type: "custom:gap-card"
    height: 15

  - type: "custom:layout-card"
    layout_type: "custom:grid-layout"
    layout:
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr
      grid-template-rows: auto
      margin: 0px
    cards:
      - type: "custom:decluttering-card"
        template: section-header
        view_layout:
          grid-column: span 6
        variables:
          - name: "WC Maior"
          - script: script.turn_off_wc_maior
          - sensor_entity: sensor.lights_on_wc_maior
          - font_size: 20px

      - !include ../views_items/wc_maior/light.luz_wc_maior.yaml

      - !include ../views_items/wc_maior/light.led_wc_maior.yaml

      - template: es-water-pump
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 2
          grid-row: span 2
        variables:
          - template: water-pump-2
          - entity: sensor.baxi_heat_pump_controller_compressor_power
          - name: "Bomba Água"
          - background-on: --purple-gradient, var(--ha-card-background-es-on)

      - type: custom:mod-card
        view_layout:
          grid-column: span 2
        card_mod:
          style:
            .: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
              }
            layout-card $ grid-layout $: "#root { --masonry-view-card-margin: 3.3px 0; align-items: center;}"
        card:
          type: "custom:layout-card"
          view_layout:
            grid-column: span 1
          layout_type: "custom:grid-layout"
          layout:
            card_margin: 0px
            grid-template-columns: 1fr
            grid-template-rows: 1fr
            height: 100%
            margin: 0
            padding: 0
          cards:
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.water_sensor_2
                - icon: mdi:toilet
                - state-1: "ALERTA"
                - state-2: "OK"
                - show-name: true
                - name: Fuga

      - type: custom:mod-card
        view_layout:
          grid-column: span 2
        card_mod:
          style:
            .: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
              }
            layout-card $ grid-layout $: "#root { --masonry-view-card-margin: 3.3px 0; align-items: center;}"
        card:
          type: "custom:layout-card"
          view_layout:
            grid-column: span 1
          layout_type: "custom:grid-layout"
          layout:
            card_margin: 0px
            grid-template-columns: 1fr
            grid-template-rows: 1fr 1fr
            height: 100%
            margin: 0
            padding: 0
          cards:
            - template: es-light-small
              type: "custom:decluttering-card"
              variables:
                - template: light-strip
                - entity: light.led_wc_maior_esq
                - name: LED Esq
            - template: es-light-small
              type: "custom:decluttering-card"
              variables:
                - template: light-strip
                - entity: light.led_wc_maior_dir
                - name: LED Dir

      - template: es-light-small
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 2
        variables:
          - template: mirror
          - entity: switch.espelho_wc_maior
          - name: Espelho

      - type: "custom:gap-card"
        height: 30
        view_layout:
          grid-column: span 6

      - type: "custom:decluttering-card"
        template: section-header
        view_layout:
          grid-column: span 6
        variables:
          - name: "WC Social"
          - script: script.turn_off_wc_social
          - sensor_entity: sensor.lights_on_wc_social
          - font_size: 20px

      - !include ../views_items/wc_social/light.luz_wc_social.yaml

      - !include ../views_items/wc_social/light.led_wc_social.yaml

      - type: custom:mod-card
        view_layout:
          grid-column: span 2
        card_mod:
          style:
            .: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
              }
            layout-card $ grid-layout $: "#root { --masonry-view-card-margin: 3.3px 0; align-items: center;}"
        card:
          type: "custom:layout-card"
          view_layout:
            grid-column: span 1
          layout_type: "custom:grid-layout"
          layout:
            card_margin: 0px
            grid-template-columns: 1fr
            grid-template-rows: 1fr 1fr
            height: 100%
            margin: 0
            padding: 0
          cards:
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: binary_sensor.shelly_blu_motion_1_motion
                - state-1: "on"
                - state-2: "off"
                - icon: mdi:motion-sensor
                - color-state-on: --ha-card-color-name-on
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.water_sensor
                - icon: mdi:toilet
                - state-1: "ALERTA"
                - state-2: "OK"
                - show-name: true
                - name: Fuga

      - type: "custom:gap-card"
        height: 20
        view_layout:
          grid-column: span 6
