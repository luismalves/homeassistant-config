####
# VIEW
# WCs
####
title: WC Suite
path: bedroom-wc
background: "var(--background-view-bedroom)"

type: custom:vertical-layout
layout:
  card_margin: 8px 0px
  margin: 0px
  max_width: 350
cards:
  - type: "custom:gap-card"
    height: 5

  - type: "custom:layout-card"
    layout_type: "custom:grid-layout"
    layout:
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr
      grid-template-rows: auto
      margin: 0px
    cards:
      - type: "custom:decluttering-card"
        template: section-header
        view_layout:
          grid-column: span 6
        variables:
          - name: "WC Suite"
          - script: script.turn_off_wc_suite
          - sensor_entity: sensor.lights_on_wc_suite

      - !include ../views_items/wc_suite/light.led_wc_suite.yaml

      - !include ../views_items/wc_suite/light.luz_wc_suite.yaml

      - template: es-cover
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 2
        variables:
          - template: shutter
          - toggle-script: script.toggle_cover_wc_suite
          - entity: cover.estores_wc_suite
          - name: Estores WC

      - !include ../views_items/wc_suite/light.zuma_bathroom.yaml

      - template: es-switch
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 2
        variables:
          - template: fan
          - entity: switch.extrator_wc_suite
          - name: Extrator

      - type: custom:mod-card
        view_layout:
          grid-column: span 2
        card_mod:
          style:
            .: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
              }
            layout-card $ grid-layout $: "#root { --masonry-view-card-margin: 3.3px 0; align-items: center;}"
        card:
          type: "custom:layout-card"
          view_layout:
            grid-column: span 1
          layout_type: "custom:grid-layout"
          layout:
            card_margin: 0px
            grid-template-columns: 1fr
            grid-template-rows: 1.3fr fr
            height: 100%
            margin: 0
            padding: 0
          cards:
            - template: es-light-small
              type: "custom:decluttering-card"
              view_layout:
                grid-column: span 2
              variables:
                - template: light-spot-v2
                - entity: switch.espelho_wc_suite
                - name: Espelho
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.presence_wc_suite
                - state-1: "Detetado"
                - state-2: "Vazio"
                - icon: mdi:motion-sensor
                - color-state-on: --ha-card-color-name-on

      - type: custom:mod-card
        view_layout:
          grid-column: span 2
        card_mod:
          style:
            .: |
              ha-card {
                background: none;
                box-shadow: none;
                border: none;
              }
            layout-card $ grid-layout $: "#root { --masonry-view-card-margin: 3.3px 0; align-items: center;}"
        card:
          type: "custom:layout-card"
          view_layout:
            grid-column: span 1
          layout_type: "custom:grid-layout"
          layout:
            card_margin: 0px
            grid-template-columns: 1fr
            grid-template-rows: 1fr 1fr 1fr
            height: 100%
            margin: 0
            padding: 0
          cards:
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: binary_sensor.openclose_wc_suite_contact
                - state-1: "off"
                - state-2: "on"
                - icon: mdi:door
                - color-state-on: --ha-card-color-name-on
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.environment_2_temperature
                - icon: mdi:thermometer
            - template: sensor-pill
              type: "custom:decluttering-card"
              variables:
                - entity: sensor.environment_2_humidity
                - icon: mdi:cloud-percent

      - template: es-speaker
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 2
        variables:
          - template: speaker-nest-hub
          - entity: media_player.zuma_bathroom
          - name: "Speaker"
          - room: "WC Suite"
          - circle-1: entity.attributes.volume_level
          - circle-2: 0.01
          - circle-3: "playing"
          - circle-4: volume_level

      - template: subsubtitle
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 6
        variables:
          - content: Scenes

      - template: script-as-scene
        type: "custom:decluttering-card"
        view_layout:
          grid-column: span 3
        variables:
          - template: shower
          - script: script.set_suite_shower_conditions
          - entity: script.set_suite_shower_conditions
          - name: "Shower time"

      - type: "custom:gap-card"
        height: 20
        view_layout:
          grid-column: span 6
